# Build-script approval (pnpm 11+; replaces onlyBuiltDependencies).
# @swc/core needs its postinstall to wire up the native binary that Rspack/SWC
# use. core-js's postinstall only prints a donation banner, so it is denied.
allowBuilds:
  '@swc/core': true
  core-js: false

# The swizzled theme components in src/theme/ import from these packages, which
# are transitive dependencies of @docusaurus/preset-classic. pnpm's isolated
# node_modules would otherwise hide them from the project root, so hoist them.
publicHoistPattern:
  - '@docusaurus/theme-common'
  - '@docusaurus/plugin-content-docs'

